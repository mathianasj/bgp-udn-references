name: Generate D2 Diagrams

on:
  push:
    paths:
      - '**.d2'
      - '.github/workflows/generate-diagrams.yml'
    branches:
      - main
      - master
  pull_request:
    paths:
      - '**.d2'
      - '.github/workflows/generate-diagrams.yml'
  workflow_dispatch:

jobs:
  generate-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install D2
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s --
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          d2 --version

      - name: Generate diagrams (SVG, PNG, PDF)
        run: |
          echo "Generating diagrams in all formats..."

          # Detailed diagram - all formats
          d2 --layout elk openshift-bgp-network.d2 openshift-bgp-network.svg
          d2 --layout elk openshift-bgp-network.d2 openshift-bgp-network.png
          d2 --layout elk openshift-bgp-network.d2 openshift-bgp-network.pdf

          # Simple diagram - all formats
          d2 simple-bgp-config.d2 simple-bgp-config.svg
          d2 simple-bgp-config.d2 simple-bgp-config.png
          d2 simple-bgp-config.d2 simple-bgp-config.pdf

          echo "✓ All diagrams generated (SVG, PNG, PDF)"

      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet *.svg *.png *.pdf 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push generated files
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f *.svg *.png *.pdf
          git commit -m "Auto-generate diagrams (SVG, PNG, PDF) from D2 files [skip ci]"
          git push
